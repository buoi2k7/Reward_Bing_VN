<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <title>Bing Rewards Auto</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="compact">
  <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <h1>Rewards Auto</h1>
        <p class="brand-sub" id="version-tag">v4.1 · Direct Count</p>
      </div>
    </div>
    <div class="header-right">
      <div class="points-display" id="points-display">
        <span class="points-label">Points</span>
        <span class="points-value" id="points-value">0</span>
        <span class="points-earned" id="points-earned"></span>
      </div>
      <button class="btn-icon btn-expand" id="btn-toggle-size" title="Mở rộng / Thu nhỏ">
        <svg id="icon-expand" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 10v4h4M14 6V2h-4M2 6V2h4M14 10v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="btn-icon btn-detach" id="btn-detach-window" title="Mo cua so dieu khien roi">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 3H3v10h10v-3M9 3h4v4M8 8l5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== STATUS BAR ===== -->
  <div class="status-bar glass-panel" id="status-section">
    <div class="status-info">
      <div class="status-badge" id="status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Idle</span>
      </div>
      <div class="status-side">
        <span class="phase-info" id="phase-info"></span>
        <span class="ban-chip unknown" id="ban-chip" title="Trạng thái account/reward diagnostics">BAN: --</span>
      </div>
    </div>
    <div class="progress-wrapper">
      <div class="progress-bar-bg">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <span class="progress-text" id="progress-text">0/0</span>
    </div>
  </div>

  <div class="popup-workspace">
    <div class="main-column">
      <!-- ===== CONTROLS ===== -->
      <div class="controls glass-panel" id="controls-section">
        <div class="controls-row controls-primary">
          <button class="btn btn-primary btn-lg" id="btn-search" title="Bắt đầu tìm kiếm tự động">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><polygon points="5,3 19,12 5,21" fill="currentColor"/></svg>
            <span>Search</span>
          </button>
          <button class="btn btn-danger" id="btn-stop" title="Dừng lại">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor"/></svg>
            <span>Stop</span>
          </button>
        </div>
        <div class="controls-row controls-secondary">
          <button class="btn btn-ghost" id="btn-points" title="Kiểm tra điểm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="currentColor"/></svg>
            <span>Points</span>
          </button>
          <button class="btn btn-check-ban" id="btn-check-ban" title="Kiểm tra activity/counter và dấu hiệu tài khoản bị hạn chế">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.5-2.9 8.5-7 10-4.1-1.5-7-5.5-7-10V6l7-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Check</span>
          </button>
          <button class="btn btn-ghost" id="btn-reset-page" title="Reset page & dọn tabs">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M1 4v6h6M23 20v-6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Reset</span>
          </button>
          <button class="btn btn-ghost btn-reset-progress" id="btn-reset-progress" title="Xóa tiến trình search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Progress</span>
          </button>
          <button class="btn btn-clear-data" id="btn-clear-data" title="Xóa cache Bing, lịch sử từ khóa/search URL, autocomplete — giữ session login MS/Bing">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 002 2h8a2 2 0 002-2l1-12M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Clear</span>
          </button>
        </div>
      </div>

      <!-- ===== EXPANDED SECTION: CONFIG ===== -->
      <div class="expanded-section" id="expanded-section">
        <!-- Daily Progress Panel -->
        <div class="daily-panel glass-panel" id="daily-panel">
          <div class="panel-header">
            <span>📅 Tiến độ hôm nay</span>
            <span class="auto-save-indicator" id="auto-save-indicator">✓ Saved</span>
          </div>
          <div class="daily-body">
            <div class="daily-stats-row">
              <div class="daily-stat-item">
                <span class="daily-stat-value" id="daily-earned">+0 pts</span>
                <span class="daily-stat-label">Kiếm hôm nay</span>
              </div>
              <div class="daily-stat-item">
                <span class="daily-stat-value" id="daily-searches">~0 lần</span>
                <span class="daily-stat-label">Đã search</span>
              </div>
              <div class="daily-stat-item">
                <span class="daily-stat-value" id="daily-split">0/0</span>
                <span class="daily-stat-label">PC / Mobile</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Config Panel -->
        <div class="config-panel glass-panel">
          <div class="panel-header">
            <span>⚙️ Cấu hình</span>
          </div>
          <div class="config-body">
            <div class="config-row">
              <div class="form-group">
                <label class="form-label">
                  PC Searches
                  <span class="help-icon" data-tooltip="Số lượt PC search muốn chạy. Tool sẽ giữ đúng số bạn nhập.">?</span>
                </label>
                <input type="number" class="form-input" id="cfg-search" value="30" min="0" max="200">
              </div>
            </div>
            <div class="speed-control">
              <div class="speed-header">
                <label class="form-label">
                  ⚡ Tốc độ
                  <span class="help-icon" data-tooltip="Chỉ điều chỉnh delay giữa các lượt search. Không có nghỉ wave hay cooldown dài.">?</span>
                </label>
                <span class="speed-badge" id="speed-badge">Vừa</span>
              </div>
              <input type="range" class="speed-slider" id="cfg-speed" min="1" max="6" value="3" step="1">
              <div class="speed-labels">
                <span>Chậm</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
                <span>Tối đa</span>
              </div>
              <div class="speed-detail" id="speed-detail">Delay 14-24s · Không wave pause</div>
            </div>
            <div class="toggle-row">
              <div class="toggle-item">
                <span class="toggle-label">
                  📖 Click kết quả
                  <span class="help-icon" data-tooltip="Sau mỗi search, mở 1 link kết quả và đọc 5-12s. Simulate hành vi thật hơn.">?</span>
                </span>
                <label class="switch">
                  <input type="checkbox" id="cfg-read-result" checked>
                  <span class="slider"></span>
                </label>
              </div>
            </div>
            <div class="toggle-row">
              <div class="toggle-item">
                <span class="toggle-label">
                  📱 Mobile Search
                  <span class="help-icon" data-tooltip="Sau PC search, tự động chạy thêm Mobile search với UA giả lập">?</span>
                </span>
                <label class="switch">
                  <input type="checkbox" id="cfg-mobile">
                  <span class="slider"></span>
                </label>
              </div>
            </div>
            <!-- Mobile count — only show when mobile is ON -->
            <div class="mobile-count-row" id="mobile-count-row" style="display:none">
              <div class="form-group">
                <label class="form-label">📱 Mobile Searches <span class="help-icon" data-tooltip="Số lượt mobile search sau PC. Tool sẽ giữ đúng số bạn nhập.">?</span></label>
                <input type="number" class="form-input" id="cfg-mobile-count" value="20" min="0" max="200">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== LOG TERMINAL ===== -->
    <div class="side-column">
      <div class="log-section glass-panel" id="log-section">
        <div class="log-header">
          <span>Terminal</span>
          <button class="btn-clear" id="btn-clear-logs">Clear</button>
        </div>
        <div class="log-window" id="log-window">
          <div class="log-entry info"><span class="log-time">[--:--:--]</span> Ready. Click Search to begin.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
