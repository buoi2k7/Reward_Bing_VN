<!DOCTYPE html>
<html>

<head>
  <title>Extension Validator</title>
  <style>
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: Consolas, monospace;
      padding: 20px;
    }

    .ok {
      color: #10b981;
    }

    .err {
      color: #ef4444;
    }

    .warn {
      color: #f59e0b;
    }

    pre {
      background: #111;
      padding: 10px;
      border-radius: 6px;
      overflow: auto;
    }

    button {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    h2 {
      color: #00d4ff;
    }
  </style>
</head>

<body>
  <h1>🔍 Extension Validator</h1>
  <p>Mở file này trong Chrome (double-click) để kiểm tra extension có lỗi gì</p>
  <button id="btn-run">▶️ Run Validation</button>
  <pre id="output">Click the button to start...</pre>

  <script src="validate.js"></script>
</body>

</html>
